; VR-only default overlay. Deployed over the SkyrimVR install AFTER the shared
; Skyrim/Data defaults, so it must stay a COMPLETE copy of
; Skyrim/Data/MCM/Config/FloatingSubtitles/settings.ini and differ ONLY in the
; per-platform values below (narrower wrap width than flat). Keep in sync.
[Settings]
bGeneralSubtitles = 1
bDialogueSubtitles = 0
bShowSpeakerName = 0
bShowHUDDialogue = 0
bShowHUDGeneral = 0
bScrollSubtitles = 1
fSubtitleScale = 1.0
fHeadOffset = 15.0
bUseBTPSWidgetPosition = 1
bUseTrueHUDWidgetPosition = 1
bRequireLineOfSight = 1
fObscuredSubtitleOpacity = 0.35
bDualSubtitles = 0
iLanguagePrimary = -1
iMaxCharactersPerLinePrimary = 45
fSubtitleAlphaPrimary = 1.0
fDualSubtitleSpacing = 0.5
iLanguageSecondary = -1
iMaxCharactersPerLineSecondary = 45
fSubtitleAlphaSecondary = 1.0
iOffscreenSubtitles = 1
iMaxOffscreenSubtitles = 3
bDebugLog = 0
